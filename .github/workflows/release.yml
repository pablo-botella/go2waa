# Release: runs when a v* tag lands, and only blesses tags that sit on
# main. The gate checks the tag against the config's own number, then
# regenerates the docs on a clean checkout (a stale committed artifact
# fails the diff), vets and tests. go2waa is a library — no binaries
# to ship: the release IS the tag, verified and published with notes.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the tag-on-main check needs origin/main

      - name: tag must be on main
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::tag ${GITHUB_REF_NAME} is not on main"; exit 1; }

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: tag matches the config
        # the config owns the release number; git only consumes it — a
        # tag the config did not declare is refused at the door
        run: |
          want="$(go run github.com/pablo-botella/mkskill/cmd/mkskill@latest -q -vout version)"
          [ "$want" = "$GITHUB_REF_NAME" ] || {
            echo "::error::config says $want, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: docs are fresh
        # regenerate everything; if a COMMITTED artifact changes, someone
        # edited _mkskill/ without running go generate — refuse the tag
        run: |
          go generate ./...
          git diff --exit-code || {
            echo "::error::generated docs are stale — run: go generate ./..."; exit 1; }

      - run: go vet ./...
      - run: go test ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY"
